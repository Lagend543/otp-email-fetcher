<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Email Fetcher - Telegram Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f1f5f9;
            --gray: #64748b;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            background: rgba(99, 102, 241, 0.2);
            color: #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .tab-btn:hover {
            background: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card */
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: var(--primary);
        }

        /* Input Group */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #cbd5e1;
            font-weight: 600;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Button */
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        /* Message Item */
        .message-item {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .message-item:hover {
            background: rgba(15, 23, 42, 0.8);
            border-left-color: var(--secondary);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-email {
            color: var(--primary);
            font-weight: 600;
        }

        .message-time {
            color: var(--gray);
            font-size: 0.9em;
        }

        .message-code {
            background: var(--primary);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1.1em;
            display: inline-block;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .message-code:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .message-text {
            color: #cbd5e1;
            word-break: break-word;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* Smart Links - Shows actual context text! */
        .message-links {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .smart-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 8px;
            color: #fbbf24;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            word-break: break-word;
            max-width: 100%;
        }

        .smart-link:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(99, 102, 241, 0.25));
            border-color: rgba(251, 191, 36, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.2);
        }

        .smart-link::before {
            content: '🔗';
            flex-shrink: 0;
        }

        /* Message Box */
        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid;
        }

        .message.info {
            background: rgba(99, 102, 241, 0.1);
            border-left-color: var(--primary);
            color: #a5b4fc;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: var(--success);
            color: #86efac;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: var(--danger);
            color: #fca5a5;
        }

        /* API Status */
        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .api-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .api-status.connected .dot {
            background: var(--success);
        }

        .api-status.disconnected .dot {
            background: var(--danger);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 1.8em; }
            .tabs { flex-direction: column; }
            .tab-btn { min-width: auto; }
            .smart-link { max-width: 90%; }
        }

        /* Copy Feedback */
        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            to { transform: translateX(400px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📧 OTP Email Fetcher</h1>
            <p>Receive temporary emails from your Telegram bot - 24/7 running</p>
        </header>

        <div class="api-status" id="apiStatus">
            <div class="dot"></div>
            <span id="apiStatusText">Connecting...</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('view')">👁️ View Emails</button>
            <button class="tab-btn" onclick="switchTab('all')">📨 All Messages</button>
            <button class="tab-btn" onclick="switchTab('admin')">🔐 Admin</button>
        </div>

        <!-- View Emails Tab -->
        <div id="view" class="tab-content active">
            <div class="card">
                <h2>👁️ View Emails</h2>
                <p style="color: #94a3b8; margin-bottom: 20px;">Enter your 6-digit code to view emails</p>
                
                <div class="input-group">
                    <label>6-Digit Code</label>
                    <input type="text" id="viewCode" placeholder="e.g., 123456" maxlength="6">
                </div>

                <button class="btn btn-primary" onclick="getEmails()">🔍 Get Emails</button>

                <div id="emailsResult"></div>
            </div>
        </div>

        <!-- All Messages Tab -->
        <div id="all" class="tab-content">
            <div class="card">
                <h2>📨 All Messages</h2>
                <button class="btn btn-primary" onclick="getAllMessages()" style="margin-bottom: 20px;">📥 Load Messages</button>
                <div id="allMessagesResult"></div>
            </div>
        </div>

        <!-- Admin Tab -->
        <div id="admin" class="tab-content">
            <div class="card">
                <h2>🔐 Admin Panel</h2>
                <div id="adminLogin">
                    <p style="color: #94a3b8; margin-bottom: 20px;">Enter admin password</p>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="adminPassword" placeholder="••••••" onkeypress="if(event.key==='Enter') verifyAdmin()">
                    </div>
                    <button class="btn btn-primary" onclick="verifyAdmin()">🔓 Unlock</button>
                </div>

                <div id="adminPanel" style="display: none;">
                    <div style="background: rgba(16, 185, 129, 0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid var(--success);">
                        <h3 style="color: var(--success); margin-bottom: 15px;">➕ Add Email</h3>
                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" id="adminEmail" placeholder="example@email.com">
                        </div>
                        <button class="btn btn-primary" onclick="addEmail()" style="background: var(--success);">Add Email</button>
                    </div>

                    <div id="adminEmailList"></div>
                    <button class="btn btn-primary" style="background: var(--danger); margin-top: 20px;" onclick="logoutAdmin()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let apiUrl = localStorage.getItem('apiUrl') || 'https://otp-email-fetcher.onrender.com/api';
        let isAdminLoggedIn = false;

        document.addEventListener('DOMContentLoaded', () => {
            checkApiStatus();
            setInterval(checkApiStatus, 5000);
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function checkApiStatus() {
            try {
                const response = await fetch(`${apiUrl}/health`);
                if (response.ok) {
                    document.getElementById('apiStatus').className = 'api-status connected';
                    document.getElementById('apiStatusText').textContent = '✅ API Connected';
                } else {
                    setDisconnected();
                }
            } catch (e) {
                setDisconnected();
            }
        }

        function setDisconnected() {
            document.getElementById('apiStatus').className = 'api-status disconnected';
            document.getElementById('apiStatusText').textContent = '❌ API Disconnected';
        }

        async function getEmails() {
            const code = document.getElementById('viewCode').value.trim();
            if (!code) return;

            try {
                const response = await fetch(`${apiUrl}/messages/${code}`);
                if (!response.ok) return showMessage('Invalid code', 'error');

                const data = await response.json();
                displayEmails(data);
            } catch (e) {
                showMessage('Error connecting to API', 'error');
            }
        }

        function displayEmails(data) {
            let html = `<div class="message success" style="margin-top: 20px;">✅ Found ${data.messageCount} message(s)</div>`;

            data.messages.forEach(msg => {
                const date = new Date(msg.timestamp).toLocaleString();
                html += `<div class="message-item">
                    <div class="message-header">
                        <span class="message-email">${data.email}</span>
                        <span class="message-time">${date}</span>
                    </div>
                    ${msg.codes.length > 0 ? `<div class="message-code" onclick="copyToClipboard('${msg.codes[0]}')">${msg.codes[0]} 📋</div>` : ''}
                    <div class="message-text">${escapeHtml(msg.text)}</div>
                    ${msg.links && msg.links.length > 0 ? `<div class="message-links">
                        ${msg.links.map(link => `<a href="${link.url}" target="_blank" class="smart-link" title="${link.url}">${link.text}</a>`).join('')}
                    </div>` : ''}
                </div>`;
            });

            document.getElementById('emailsResult').innerHTML = html;
        }

        async function getAllMessages() {
            try {
                const response = await fetch(`${apiUrl}/all-messages`);
                const data = await response.json();

                let html = `<div class="message info">📨 Last ${data.length} messages</div>`;
                data.forEach(msg => {
                    const date = new Date(msg.timestamp).toLocaleString();
                    html += `<div class="message-item">
                        <div class="message-header">
                            <span class="message-email">${msg.email}</span>
                            <span class="message-time">${date}</span>
                        </div>
                        ${msg.codes.length > 0 ? `<div class="message-code" onclick="copyToClipboard('${msg.codes[0]}')">${msg.codes[0]} 📋</div>` : ''}
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        ${msg.links && msg.links.length > 0 ? `<div class="message-links">
                            ${msg.links.map(link => `<a href="${link.url}" target="_blank" class="smart-link" title="${link.url}">${link.text}</a>`).join('')}
                        </div>` : ''}
                    </div>`;
                });

                document.getElementById('allMessagesResult').innerHTML = html;
            } catch (e) {
                showMessage('Error loading messages', 'error');
            }
        }

        async function verifyAdmin() {
            const password = document.getElementById('adminPassword').value;
            try {
                const response = await fetch(`${apiUrl}/admin/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadAdminEmails();
                } else {
                    showMessage('Invalid password', 'error');
                }
            } catch (e) {
                showMessage('Error verifying password', 'error');
            }
        }

        async function loadAdminEmails() {
            try {
                const response = await fetch(`${apiUrl}/emails`);
                const emails = await response.json();

                let html = '';
                emails.forEach(item => {
                    html += `<div class="message-item">
                        <div class="message-header">
                            <div>
                                <div class="message-email">${item.email}</div>
                                <div class="message-time">Code: <strong>${item.code}</strong> | ${item.messages} messages</div>
                            </div>
