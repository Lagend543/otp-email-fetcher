<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Email Fetcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --gray: #64748b;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #ec4899 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.3);
        }
        
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { font-size: 1.1em; opacity: 0.95; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            background: rgba(99, 102, 241, 0.2);
            color: #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #ec4899 100%);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        
        .card h2 { font-size: 1.5em; margin-bottom: 20px; color: var(--primary); }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-weight: 600; }
        
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 1em;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: white;
        }
        
        .btn-primary:hover { transform: translateY(-2px); }
        
        .btn-danger {
            background: var(--danger);
            color: white;
            width: auto;
            padding: 8px 16px;
        }
        
        .message-box {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .email-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .api-status.connected .dot { background: var(--success); }
        .api-status.disconnected .dot { background: var(--danger); animation: none; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .message { padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid; }
        .message.success { background: rgba(16, 185, 129, 0.1); border-left-color: var(--success); color: #86efac; }
        .message.error { background: rgba(239, 68, 68, 0.1); border-left-color: var(--danger); color: #fca5a5; }
        
        @media (max-width: 600px) {
            header h1 { font-size: 1.8em; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📧 OTP Email Fetcher</h1>
            <p>View your emails - Simple & Fast</p>
        </header>
        
        <div class="api-status" id="apiStatus">
            <div class="dot"></div>
            <span id="apiStatusText">Connecting...</span>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('view')">👁️ View Emails</button>
            <button class="tab-btn" onclick="switchTab('admin')">🔐 Admin</button>
        </div>
        
        <!-- View Emails -->
        <div id="view" class="tab-content active">
            <div class="card">
                <h2>👁️ View Emails</h2>
                <p style="color: #94a3b8; margin-bottom: 20px;">Enter your 6-digit code</p>
                
                <div class="input-group">
                    <label>Your Code</label>
                    <input type="text" id="viewCode" placeholder="e.g., 123456" maxlength="6">
                </div>
                
                <button class="btn btn-primary" onclick="getEmails()">🔍 Get Emails</button>
                <div id="emailsResult"></div>
            </div>
        </div>
        
        <!-- Admin -->
        <div id="admin" class="tab-content">
            <div class="card">
                <h2>🔐 Admin Panel</h2>
                
                <div id="adminLogin">
                    <p style="color: #94a3b8; margin-bottom: 20px;">Enter password</p>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="adminPassword" placeholder="••••••" onkeypress="if(event.key==='Enter') verifyAdmin()">
                    </div>
                    <button class="btn btn-primary" onclick="verifyAdmin()">🔓 Login</button>
                </div>
                
                <div id="adminPanel" style="display: none;">
                    <div style="background: rgba(16, 185, 129, 0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid var(--success);">
                        <h3 style="color: var(--success); margin-bottom: 15px;">➕ Add Email</h3>
                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" id="adminEmail" placeholder="example@email.com">
                        </div>
                        <button class="btn btn-primary" onclick="addEmail()" style="background: var(--success);">Add Email</button>
                    </div>
                    
                    <h3 style="color: var(--primary); margin-bottom: 15px;">📋 Your Emails</h3>
                    <div id="adminEmailList"></div>
                    
                    <button class="btn btn-danger" onclick="logoutAdmin()">Logout</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let apiUrl = localStorage.getItem('apiUrl') || 'https://otp-email-fetcher.onrender.com/api';
        
        document.addEventListener('DOMContentLoaded', () => {
            checkApiStatus();
            setInterval(checkApiStatus, 5000);
        });
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        async function checkApiStatus() {
            try {
                const response = await fetch(`${apiUrl}/health`);
                if (response.ok) {
                    document.getElementById('apiStatus').className = 'api-status connected';
                    document.getElementById('apiStatusText').textContent = '✅ Connected';
                } else {
                    setDisconnected();
                }
            } catch {
                setDisconnected();
            }
        }
        
        function setDisconnected() {
            document.getElementById('apiStatus').className = 'api-status disconnected';
            document.getElementById('apiStatusText').textContent = '❌ Disconnected';
        }
        
        async function getEmails() {
            const code = document.getElementById('viewCode').value.trim();
            if (!code) return showMessage('Enter code', 'error');
            
            try {
                const response = await fetch(`${apiUrl}/messages/${code}`);
                if (!response.ok) return showMessage('Invalid code', 'error');
                
                const data = await response.json();
                
                let html = `<div class="message success" style="margin-top: 20px;">✅ Found ${data.messageCount} message(s)</div>`;
                
                data.messages.forEach(msg => {
                    const date = new Date(msg.timestamp).toLocaleString();
                    html += `<div>
                        <strong style="color: var(--primary);">${date}</strong>
                        <div class="message-box">${escapeHtml(msg.text)}</div>
                    </div>`;
                });
                
                document.getElementById('emailsResult').innerHTML = html;
            } catch {
                showMessage('Error', 'error');
            }
        }
        
        async function verifyAdmin() {
            const password = document.getElementById('adminPassword').value;
            try {
                const response = await fetch(`${apiUrl}/admin/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (response.ok) {
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadAdminEmails();
                } else {
                    showMessage('Invalid password', 'error');
                }
            } catch {
                showMessage('Error', 'error');
            }
        }
        
        async function loadAdminEmails() {
            try {
                const response = await fetch(`${apiUrl}/emails`);
                const emails = await response.json();
                
                let html = '';
                emails.forEach(item => {
                    html += `<div class="email-item">
                        <div>
                            <div style="color: var(--primary); font-weight: 600; margin-bottom: 5px;">${item.email}</div>
                            <div style="color: var(--gray); font-size: 0.9em;">Code: ${item.code} | ${item.messages} messages</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteEmail('${item.email}')">Delete</button>
                    </div>`;
                });
                
                document.getElementById('adminEmailList').innerHTML = html || '<p>No emails</p>';
            } catch {
                showMessage('Error', 'error');
            }
        }
        
        async function addEmail() {
            const email = document.getElementById('adminEmail').value.trim();
            if (!email) return showMessage('Enter email', 'error');
            
            try {
                const response = await fetch(`${apiUrl}/admin/add-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: 'OSM77' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showMessage(`✅ Added! Code: ${data.code}`, 'success');
                    document.getElementById('adminEmail').value = '';
                    loadAdminEmails();
                } else {
                    showMessage('Error', 'error');
                }
            } catch {
                showMessage('Error', 'error');
            }
        }
        
        async function deleteEmail(email) {
            if (!confirm(`Delete ${email}?`)) return;
            
            try {
                const response = await fetch(`${apiUrl}/admin/delete-email/${email}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: 'OSM77' })
                });
                
                if (response.ok) {
                    showMessage('✅ Deleted', 'success');
                    loadAdminEmails();
                }
            } catch {
                showMessage('Error', 'error');
            }
        }
        
        function logoutAdmin() {
            document.getElementById('adminLogin').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }
        
        function showMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            document.querySelector('.tab-content.active .card').appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
    </html>
