<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Email Fetcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-copy {
            background: #48bb78;
            color: white;
        }

        .btn-copy:hover {
            background: #38a169;
        }

        .btn-delete {
            background: #f56565;
            color: white;
        }

        .btn-delete:hover {
            background: #e53e3e;
        }

        .email-list {
            display: grid;
            gap: 15px;
        }

        .email-item {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .email-info {
            flex: 1;
            min-width: 200px;
        }

        .email-address {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .email-code {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 2px;
        }

        .email-meta {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .message-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #48bb78;
            margin-bottom: 15px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-email {
            font-weight: 600;
            color: #667eea;
            font-size: 14px;
        }

        .message-time {
            font-size: 12px;
            color: #999;
        }

        .message-text {
            color: #333;
            line-height: 1.5;
            word-break: break-word;
            margin-bottom: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .otp-codes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .otp-badge {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .otp-badge:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .status.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
        }

        .status.info {
            background: #bee3f8;
            color: #2c5282;
            border-left: 4px solid #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }

        .admin-panel {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: white;
        }

        .admin-panel h3 {
            margin-bottom: 15px;
            color: white;
        }

        .admin-panel input {
            color: #333;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 12px;
        }

        .admin-unlock {
            text-align: center;
            padding: 40px 20px;
        }

        .admin-unlock h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .admin-unlock input {
            padding: 15px;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
            max-width: 300px;
        }

        .admin-unlock .btn {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .email-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 OTP Email Fetcher</h1>
            <p>View emails from your Telegram bot</p>
        </div>

        <div class="main-card">
            <div id="status" class="status"></div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('view')">View Emails</button>
                <button class="tab-btn" onclick="switchTab('all')">All Messages</button>
                <button class="tab-btn" onclick="switchTab('admin')">Admin 🔐</button>
            </div>

            <!-- View Emails Tab -->
            <div id="view" class="tab-content active">
                <div class="input-group">
                    <input type="text" id="codeInput" placeholder="Enter 6-digit code..." maxlength="6">
                    <button class="btn btn-primary" onclick="fetchMessages()">Get Emails</button>
                    <button class="btn btn-primary" onclick="autoRefresh()" id="refreshBtn">🔄 Auto Refresh</button>
                </div>
                <div id="messagesContainer"></div>
            </div>

            <!-- All Messages Tab -->
            <div id="all" class="tab-content">
                <div class="input-group">
                    <button class="btn btn-primary" onclick="fetchAllMessages()">Load Recent Messages</button>
                    <button class="btn btn-primary" onclick="autoRefreshAll()" id="refreshAllBtn">🔄 Auto Refresh</button>
                </div>
                <div id="allMessagesContainer"></div>
            </div>

            <!-- Admin Panel Tab -->
            <div id="admin" class="tab-content">
                <div id="adminContent"></div>
            </div>
        </div>

        <div class="footer">
            <p>🔗 API: <span id="apiStatus">Connecting...</span></p>
            <p style="margin-top: 10px;">Running 24/7 on Render - 100% FREE ✅</p>
        </div>
    </div>

    <script>
        // Get API URL from localStorage or prompt
        let API_URL = localStorage.getItem('API_URL');
        
        if (!API_URL) {
            const url = prompt('Enter your Render API URL:\n(Example: https://otp-email-fetcher.onrender.com/api)');
            if (url) {
                let cleanUrl = url.replace(/\/$/, '');
                if (!cleanUrl.endsWith('/api')) {
                    cleanUrl = cleanUrl + '/api';
                }
                API_URL = cleanUrl;
                localStorage.setItem('API_URL', API_URL);
            } else {
                API_URL = 'http://localhost:3000/api';
            }
        }

        let refreshInterval = null;
        let refreshAllInterval = null;
        let adminAuthenticated = false;

        // Check API
        async function checkAPI() {
            try {
                const res = await fetch(`${API_URL}/health`);
                if (res.ok) {
                    document.getElementById('apiStatus').textContent = '✅ Connected';
                } else {
                    document.getElementById('apiStatus').textContent = '❌ Offline';
                }
            } catch {
                document.getElementById('apiStatus').textContent = '❌ Connection Failed';
            }
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'admin') {
                renderAdminPanel();
            }
        }

        // Show status
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status show ${type}`;
            setTimeout(() => statusEl.classList.remove('show'), 4000);
        }

        // ==================== ADMIN PANEL ====================

        function renderAdminPanel() {
            const container = document.getElementById('adminContent');

            if (!adminAuthenticated) {
                container.innerHTML = `
                    <div class="admin-unlock">
                        <h2>🔐 Admin Panel</h2>
                        <p style="margin-bottom: 20px; color: #666;">Enter password to access admin panel</p>
                        <input type="password" id="adminPassword" placeholder="Enter password" 
                               onkeypress="if(event.key==='Enter') verifyAdminPassword()">
                        <button class="btn btn-primary" onclick="verifyAdminPassword()">Unlock Admin Panel</button>
                    </div>
                `;
                document.getElementById('adminPassword').focus();
            } else {
                showAdminControls();
            }
        }

        async function verifyAdminPassword() {
            const password = document.getElementById('adminPassword').value;

            if (!password) {
                showStatus('❌ Please enter password', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/admin/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    adminAuthenticated = true;
                    showStatus('✅ Admin access granted!', 'success');
                    showAdminControls();
                } else {
                    showStatus('❌ Invalid password', 'error');
                }
            } catch (err) {
                showStatus('❌ Connection error', 'error');
            }
        }

        function showAdminControls() {
            const container = document.getElementById('adminContent');
            container.innerHTML = `
                <div class="admin-panel">
                    <h3>👨‍💼 Admin Controls</h3>
                    <p style="margin-bottom: 15px; opacity: 0.9;">Logged in as Admin ✅</p>
                </div>

                <div class="admin-panel" style="background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);">
                    <h3>➕ Add New Email</h3>
                    <div class="input-group">
                        <input type="email" id="newEmail" placeholder="example@gmail.com" style="color: #333;">
                        <button class="btn btn-primary" onclick="addEmailAdmin()">Add Email</button>
                    </div>
                </div>

                <h3 style="margin-top: 20px; margin-bottom: 15px; color: #333;">📧 Manage Emails & Codes</h3>
                <div id="emailsContainer"></div>

                <button class="btn btn-primary" onclick="logoutAdmin()" style="margin-top: 20px; width: 100%; background: #f56565;">Logout Admin</button>
            `;

            fetchEmailsAdmin();
        }

        async function fetchEmailsAdmin() {
            const container = document.getElementById('emailsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch(`${API_URL}/emails`);
                const emails = await res.json();

                if (emails.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>No emails added yet</p></div>';
                } else {
                    container.innerHTML = `
                        <div class="email-list">
                            ${emails.map(e => `
                                <div class="email-item">
                                    <div class="email-info">
                                        <div class="email-address">📧 ${e.email}</div>
                                        <div class="email-code">${e.code}</div>
                                        <div class="email-meta">${e.messageCount} messages</div>
                                    </div>
                                    <div class="controls">
                                        <button class="btn btn-small btn-copy" onclick="copyToClipboard('${e.code}')">Copy</button>
                                        <button class="btn btn-small btn-delete" onclick="deleteEmailAdmin('${e.email}')">Delete</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><p>❌ Error loading emails</p></div>';
            }
        }

        async function addEmailAdmin() {
            const email = document.getElementById('newEmail').value;
            const password = 'OSM77'; // Hardcoded since already authenticated

            if (!email) {
                showStatus('❌ Please enter an email', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/admin/add-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    showStatus(`✅ Email added! Code: ${data.code}`, 'success');
                    document.getElementById('newEmail').value = '';
                    fetchEmailsAdmin();
                }
            } catch (err) {
                showStatus('❌ Error adding email', 'error');
            }
        }

        async function deleteEmailAdmin(email) {
            if (!confirm(`Delete ${email}?\n\n⚠️ This will delete the code and all messages!\n\nIf you add the same email again, a new code will be generated.`)) {
                return;
            }

            const password = 'OSM77'; // Hardcoded since already authenticated

            try {
                const res = await fetch(`${API_URL}/admin/delete-email/${encodeURIComponent(email)}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    showStatus('✅ Email deleted! Code no longer works.', 'success');
                    fetchEmailsAdmin();
                } else {
                    showStatus('❌ Error deleting email', 'error');
                }
            } catch (err) {
                showStatus('❌ Connection error', 'error');
            }
        }
